spring.application.name=mj-moteur
# Connexion locale (hors Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/mountain_journey
spring.datasource.username=mj_user
spring.datasource.password=mj_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Init SQL via schema.sql au demarrage
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql


# Disable automatic column name conversion (keeps @Column names as-is)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
