spring.application.name=mj-moteur
# Connexion locale (hors Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/mountain_journey
spring.datasource.username=postgres
spring.datasource.password=Azerty123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Init SQL via schema.sql au demarrage
spring.sql.init.mode=never


# Disable automatic column name conversion (keeps @Column names as-is)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
